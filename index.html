<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV KAFI NET - xfireflix Premium</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --bg-dark: #0a0c10;
            --bg-panel: #161b22;
            --primary: #e50914;
            --primary-hover: #f40612;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Design --- */
        .sidebar {
            width: 350px;
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.4);
        }

        .sidebar-header {
            padding: 25px 20px;
            background: linear-gradient(135deg, #1f242c 0%, #161b22 100%);
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .sidebar-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h2 span {
            color: var(--primary);
        }

        .sidebar-header p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 400;
        }

        .search-container {
            padding: 15px 20px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #0d1117;
            color: white;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 16px;
        }

        /* --- Channel List --- */
        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px;
        }

        .channel-list li {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            background-color: transparent;
        }

        .channel-list li:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .channel-list li.active {
            background: linear-gradient(90deg, rgba(229,9,20,0.1) 0%, transparent 100%);
            border-left: 4px solid var(--primary);
            border-radius: 4px 8px 8px 4px;
        }

        .channel-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .channel-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .channel-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .playing-status {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            display: none;
            margin-top: 2px;
        }

        .channel-list li.active .playing-status {
            display: block;
        }

        /* --- Main Content & Player --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top, #1a202c 0%, #0a0c10 100%);
        }

        .top-header {
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .now-playing-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .live-badge {
            background-color: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .player-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        video {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            background-color: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
            outline: none;
        }

        /* --- Scrollbar Customization --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        /* --- Responsive Design (Mobile Support) --- */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 50vh; border-right: none; border-top: 1px solid var(--border-color); order: 2; }
            .main-content { height: 50vh; order: 1; }
            .player-container { padding: 15px; }
            .top-header { padding: 15px; }
            .now-playing-title { font-size: 16px; }
            video { border-radius: 8px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar / Channel List -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2 id="owner-name">IPTV <span>PRO</span></h2>
            <p id="total-channels">Fetching Channels...</p>
        </div>
        <div class="search-container">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search live TV, sports, movies..." onkeyup="filterChannels()">
            </div>
        </div>
        <ul class="channel-list" id="channel-list">
            <!-- Dynamic Channels -->
        </ul>
    </div>

    <!-- Main Player Area -->
    <div class="main-content">
        <div class="top-header">
            <div class="now-playing-title">
                <span class="live-badge">LIVE</span>
                <span id="channel-title">Select a channel to watch</span>
            </div>
        </div>
        <div class="player-container">
            <video id="video-player" controls autoplay></video>
        </div>
    </div>

    <script>

            {"name": "Live Quran TV", "url": "https://live.kwikmotion.com/sharjahtvquranlive/shqurantv.smil/playlist.m3u8"},
            {"name": "Somoy FIFA World Cup 2026", "url": "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/1702-audio_113322_eng=113200-video=2202800.m3u8"},
            {"name": "FM Radio", "url": "https://stream.spicefmbd.com/stream.m3u8"},
            {"name": "Motor Vision", "url": "https://mvg-mv-xumo.otteravision.com/mvg/mv/mv.m3u8"}
          ]
        };

        var video = document.getElementById('video-player');
        var hls;

        window.onload = function() {
            document.getElementById('owner-name').innerHTML = `${iptvData.info.owner} <span>NET</span>`;
            document.getElementById('total-channels').innerText = `Total Channels: ${iptvData.info.total_channels}`;

            const channelList = document.getElementById('channel-list');
            
            iptvData.channels.forEach((channel, index) => {
                if(channel.name.trim() !== "") { 
                    let li = document.createElement('li');
                    
                    let safeName = encodeURIComponent(channel.name);
                    let logoUrl = `https://ui-avatars.com/api/?name=${safeName}&background=random&color=fff&rounded=true&bold=true&font-size=0.4&size=120`;

                    li.innerHTML = `
                        <img src="${logoUrl}" class="channel-logo" alt="logo"> 
                        <div class="channel-info">
                            <span class="channel-name">${channel.name}</span>
                            <span class="playing-status">▶ Now Playing</span>
                        </div>
                    `;
                    
                    // Click Event Setup
                    li.onclick = function() {
                        // Remove active class from all
                        let allLis = document.querySelectorAll('.channel-list li');
                        allLis.forEach(item => item.classList.remove('active'));
                        
                        // Add active class to clicked item
                        this.classList.add('active');
                        playChannel(channel.url, channel.name);
                    };

                    channelList.appendChild(li);

                    // Auto-play the first channel
                    if(index === 0) {
                        li.classList.add('active');
                        playChannel(channel.url, channel.name);
                    }
                }
            });
        };

        function filterChannels() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let ul = document.getElementById('channel-list');
            let li = ul.getElementsByTagName('li');

            for (let i = 0; i < li.length; i++) {
                let nameSpan = li[i].querySelector('.channel-name');
                let txtValue = nameSpan.textContent || nameSpan.innerText;
                if (txtValue.toLowerCase().indexOf(input) > -1) {
                    li[i].style.display = "";
                } else {
                    li[i].style.display = "none";
                }
            }
        }

        function playChannel(url, title) {
            document.getElementById('channel-title').innerText = title;

            if (Hls.isSupported()) {
                if (hls) { hls.destroy(); }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl') || url.endsWith('.mp4')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>

</body>
</html>
