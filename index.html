<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAFI IPTV - Premium Live TV</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --primary: #E50914;
            --primary-glow: rgba(229, 9, 20, 0.5);
            --bg-main: #050505;
            --bg-panel: #111116;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border: #22222c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Mobile Top Header --- */
        .mobile-header {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #0a0a0f;
            border-bottom: 1px solid var(--border);
            z-index: 1001;
        }

        .mobile-header h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .mobile-header h2 span { color: var(--primary); }
        
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            outline: none;
        }

        /* --- Sidebar Design --- */
        .sidebar {
            width: 380px;
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 0 25px rgba(0,0,0,0.6);
            will-change: transform;
        }

        .brand-header {
            padding: 35px 20px 25px;
            text-align: center;
            background: linear-gradient(180deg, rgba(229,9,20,0.08) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
        }

        .brand-header h1 {
            font-size: 42px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--primary-glow);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .brand-header h1 span { color: var(--primary); }
        
        .total-count-badge {
            display: inline-block;
            background: rgba(229, 9, 20, 0.15);
            color: #ff4d4d;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(229, 9, 20, 0.3);
            letter-spacing: 0.5px;
        }

        .search-container {
            padding: 20px;
            background: transparent;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border: 1px solid #333;
            border-radius: 50px;
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.2);
            background-color: rgba(0, 0, 0, 0.7);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            color: var(--text-muted);
            font-size: 16px;
        }

        /* --- Channel List --- */
        .channel-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px 15px;
            transform: translateZ(0); 
        }

        .channel-list li {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .channel-list li:hover {
            background-color: rgba(255, 255, 255, 0.04);
            transform: translateX(4px);
        }

        .channel-list li.active {
            background: linear-gradient(90deg, rgba(229,9,20,0.12) 0%, transparent 100%);
            border-left: 4px solid var(--primary);
            border-radius: 4px 12px 12px 4px;
        }

        .channel-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            margin-right: 15px;
            object-fit: contain;
            background-color: #1a1a24;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .channel-info { 
            flex-grow: 1; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .channel-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-category {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playing-status {
            font-size: 10px;
            color: var(--primary);
            font-weight: 700;
            display: none;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .channel-list li.active .playing-status { display: block; }
        .channel-list li.active .channel-category { display: none; }

        /* --- Main Content & Player --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #181822 0%, #050505 100%);
        }

        .top-header {
            padding: 25px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .now-playing-title {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .live-badge {
            background-color: var(--primary);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 0 10px var(--primary-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .player-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 40px 40px 40px;
        }

        video {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16/9;
            border-radius: 16px;
            background-color: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05);
            outline: none;
        }

        /* --- Scrollbar Customization --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* --- Mobile Responsive Design --- */
        @media (max-width: 992px) {
            body { flex-direction: column; }
            .mobile-header { display: flex; }
            
            .sidebar {
                position: fixed;
                top: 66px; 
                left: 0;
                width: 100%;
                height: calc(100vh - 66px);
                transform: translateX(-100%);
            }
            .sidebar.active { transform: translateX(0); }
            
            .brand-header { display: none; } 
            
            .main-content { height: calc(100vh - 66px); }
            .top-header { padding: 15px 20px; }
            .now-playing-title { font-size: 16px; }
            .player-container { padding: 0 15px 20px 15px; align-items: flex-start; }
            video { border-radius: 8px; }
        }
    </style>
</head>

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Skip empty lines and comments
                if (!line || line.startsWith('#================') || line.startsWith('# 🖥️') || line.startsWith('# 🔗') || line.startsWith('# 🕒') || line.startsWith('# 📺') || line.startsWith('#EXTVLCOPT:') || line.startsWith('#EXTHTTP:')) continue;
                
                if (line.startsWith('#EXTINF:')) {
                    // Extract name after the last comma
                    const nameMatch = line.match(/,(.+)$/);
                    // Extract logo URL
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    // Extract Group title
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    
                    const name = nameMatch ? nameMatch[1].trim() : "Unknown Channel";
                    const logo = (logoMatch && logoMatch[1]) ? logoMatch[1].trim() : "";
                    const group = (groupMatch && groupMatch[1]) ? groupMatch[1].trim() : "Other";
                    
                    currentChannel = {
                        name: name,
                        logo: logo || generateFallbackLogo(name),
                        group: group,
                        url: ""
                    };
                } 
                else if (line.startsWith('http')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null; 
                    }
                }
            }
            return channels;
        }

        const allChannels = parseM3U(rawM3uData);
        
        const channelList = document.getElementById('channel-list');
        const videoPlayer = document.getElementById('video-player');
        const channelTitle = document.getElementById('channel-title');

        // Update Total Count
        document.getElementById('total-channels').innerText = `Total Channels: ${allChannels.length}`;

        let hls;

        function loadChannel(url, name, listItem) {
            channelTitle.innerText = name;

            document.querySelectorAll('.channel-list li').forEach(li => li.classList.remove('active'));
            if(listItem) listItem.classList.add('active');

            if(window.innerWidth <= 992) {
                document.getElementById('sidebar').classList.remove('active');
            }

            if (Hls.isSupported()) {
                if(hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoPlayer.play().catch(() => console.log('Auto-play prevented'));
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = url;
                videoPlayer.addEventListener('loadedmetadata', function() {
                    videoPlayer.play().catch(() => console.log('Auto-play prevented'));
                });
            }
        }

        function renderChannels(channels) {
            channelList.innerHTML = '';
            const fragment = document.createDocumentFragment();

            channels.forEach(channel => {
                const li = document.createElement('li');
                
                const logoImg = document.createElement('img');
                logoImg.src = channel.logo;
                logoImg.className = 'channel-logo';
                logoImg.loading = 'lazy'; 
                
                logoImg.onerror = function() { 
                    this.onerror = null;
                    this.src = generateFallbackLogo(channel.name); 
                };

                const infoDiv = document.createElement('div');
                infoDiv.className = 'channel-info';
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'channel-name';
                nameSpan.innerText = channel.name;

                const categorySpan = document.createElement('span');
                categorySpan.className = 'channel-category';
                categorySpan.innerText = channel.group;

                const playingSpan = document.createElement('span');
                playingSpan.className = 'playing-status';
                playingSpan.innerText = '● NOW PLAYING';

                infoDiv.appendChild(nameSpan);
                infoDiv.appendChild(categorySpan);
                infoDiv.appendChild(playingSpan);
                
                li.appendChild(logoImg);
                li.appendChild(infoDiv);

                li.onclick = () => loadChannel(channel.url, channel.name, li);
                fragment.appendChild(li);
            });
            
            channelList.appendChild(fragment);
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChannels.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.group.toLowerCase().includes(query)
            );
            renderChannels(filtered);
        }

        renderChannels(allChannels);

        if(allChannels.length > 0) {
            loadChannel(allChannels[0].url, allChannels[0].name, channelList.firstChild);
        }

    </script>
